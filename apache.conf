ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot "/usr/local/apache2/htdocs"
    DirectoryIndex index.html
    LimitRequestBody 104857600

    <Directory "/usr/local/apache2/htdocs">
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    # Do not pass a client-supplied IP header to the backend.
    RequestHeader unset X-Forwarded-For
    ProxyPass "/icedata/api/v2/" "http://java:8086/icedata/api/v2/" timeout=60
    ProxyPassReverse "/icedata/api/v2/" "http://java:8086/icedata/api/v2/"

    RewriteEngine On
    RewriteRule ^/?icedata/api/v2/admin(?:/|$) - [R=404,L]
    # Preserve the query string in old shared page links.
    RewriteRule ^/?index\.php$ / [R=301,L]
    # Uploaded files are available only through the Spring download endpoint.
    RewriteRule ^/?uploads/(?!$|index\.html$) - [R=404,L]

    ErrorLog /proc/self/fd/2
    CustomLog "|/usr/local/apache2/bin/rotatelogs -D -f -e -L /var/log/apache2/access.log -n 8 /var/log/apache2/access 10M" combined
</VirtualHost>
